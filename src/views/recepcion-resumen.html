<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen de recepción</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/modules/historial.css">
    <style>
        body{display:block;box-sizing:border-box;min-height:100vh;height:auto;overflow-x:hidden;overflow-y:auto;padding:24px}.reception-summary{max-width:1000px;margin:auto}.summary-hero{padding:24px;border:1px solid rgba(125,211,252,.24);border-radius:18px;background:linear-gradient(130deg,rgba(14,116,144,.28),rgba(15,23,42,.9) 60%);box-shadow:0 18px 45px rgba(0,0,0,.2)}.summary-kicker{margin:0;color:#7dd3fc;font-size:.86rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.summary-hero h1{margin:6px 0;font-size:clamp(1.8rem,4vw,2.6rem)}.summary-subtitle{margin:0;color:#cbd5e1}.summary-metrics{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.summary-metric{padding:8px 12px;border:1px solid #475569;border-radius:999px;background:rgba(15,23,42,.72);color:#e2e8f0}.summary-section{margin-top:18px;padding:20px;border:1px solid rgba(148,163,184,.2);border-radius:14px;background:rgba(15,23,42,.78)}.summary-section h2{margin:0 0 14px;font-size:1.15rem}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.summary-field{padding:12px 0;border-bottom:1px solid rgba(148,163,184,.14);min-width:0}.summary-field dt{color:#94a3b8;font-size:.8rem}.summary-field dd{margin:5px 0 0;color:#f8fafc;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.summary-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.summary-note{padding:14px;border-radius:10px;background:rgba(30,41,59,.8);min-width:0}.summary-note h3{margin:0 0 8px;color:#7dd3fc;font-size:.85rem}.summary-note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.summary-checks{display:flex;flex-wrap:wrap;gap:10px}.summary-check{padding:9px 12px;border-radius:8px;background:rgba(74,222,128,.12);color:#bbf7d0}.summary-check.is-no{background:rgba(248,113,113,.12);color:#fecaca}.summary-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.summary-photo{margin:0;padding:8px;border:1px solid #334155;border-radius:11px;background:#111c2e;color:inherit;text-align:left;cursor:zoom-in}.summary-photo img{display:block;width:100%;height:145px;object-fit:cover;border-radius:7px}.summary-photo figcaption{padding:8px 2px 2px;overflow-wrap:anywhere;font-size:.85rem}.summary-empty{color:#94a3b8}dialog{max-width:92vw;max-height:92vh;background:#0f172a;color:#f8fafc;border:1px solid #475569;border-radius:10px}dialog img{max-width:85vw;max-height:78vh}dialog button{display:block;margin:10px 0 0 auto}@media(max-width:600px){body{padding:14px}.summary-grid,.summary-notes{grid-template-columns:1fr}.summary-section{padding:15px}}
    </style>
</head>
<body class="dashboard-body">
    <main class="reception-summary">
        <p id="resumenEstado" role="status">Cargando recepción...</p>
        <header id="resumenEncabezado" class="summary-hero" hidden>
            <p id="resumenNumero" class="summary-kicker"></p><h1 id="resumenPlaca"></h1><p id="resumenVehiculo" class="summary-subtitle"></p>
            <div id="resumenIndicadores" class="summary-metrics"></div>
        </header>
        <section class="summary-section"><h2>Datos del ingreso</h2><dl id="resumenDatos" class="summary-grid"></dl></section>
        <section class="summary-section"><h2>Motivo y observaciones</h2><div id="resumenNotas" class="summary-notes"></div></section>
        <section class="summary-section"><h2>Estado de recepción</h2><div id="resumenEstadoVehiculo" class="summary-checks"></div></section>
        <section class="summary-section"><h2>Fotografías del vehículo</h2><div id="resumenFotos" class="summary-photos"></div></section>
    </main>
    <dialog id="fotoDialog"><img id="fotoGrande" alt="Fotografía de recepción"><button id="cerrarFoto" type="button">Cerrar</button></dialog>
    <script src="../scripts/modules/recepcion-resumen.js"></script>
</body>
</html>
