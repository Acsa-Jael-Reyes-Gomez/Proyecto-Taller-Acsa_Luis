<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen de recepción</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/modules/historial.css">
    <style>
        body{padding:24px}.reception-summary{max-width:1000px;margin:auto}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:12px}.summary-item{box-sizing:border-box;min-height:92px;padding:12px;border:1px solid #334155;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-start}.summary-item dt{font-size:.82rem;color:#94a3b8}.summary-item dd{margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.summary-photo{border:0;background:transparent;color:inherit;text-align:left;cursor:zoom-in}.summary-photo img{display:block;width:180px;height:135px;object-fit:cover;border-radius:8px}.summary-photo figcaption{max-width:180px;overflow-wrap:anywhere}dialog{max-width:92vw;max-height:92vh;background:#0f172a;color:#f8fafc;border:1px solid #475569;border-radius:10px}dialog img{max-width:85vw;max-height:78vh}dialog button{display:block;margin:10px 0 0 auto}@media(max-width:600px){.summary-grid{grid-template-columns:1fr}}
    </style>
</head>
<body class="dashboard-body">
    <main class="reception-summary">
        <header class="dashboard-title"><div><p>Datos y fotografías guardadas al ingreso del vehículo</p><h1 id="resumenTitulo">Resumen de recepción</h1></div></header>
        <p id="resumenEstado" role="status">Cargando recepción...</p>
        <section id="resumenDatos" class="summary-grid" aria-label="Datos de recepción"></section>
        <section><h2>Fotografías</h2><div id="resumenFotos" class="history-reception-gallery"></div></section>
    </main>
    <dialog id="fotoDialog"><img id="fotoGrande" alt="Fotografía de recepción"><button id="cerrarFoto" type="button">Cerrar</button></dialog>
    <script src="../scripts/modules/recepcion-resumen.js"></script>
</body>
</html>
